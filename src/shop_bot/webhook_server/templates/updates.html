{% extends 'base.html' %}

{% block title %}Обновления{% endblock %}

{% block content %}
<section class="content-header">
    <h1>Центр обновлений</h1>
    <p>Управление версией бота</p>
</section>

<div class="update-card">
    <div class="update-container">
        <div class="current-version">
            <h3>Текущая версия</h3>
            <span class="badge badge-primary">{{ current_version }}</span>
        </div>

        <div class="update-actions">
            <button id="checkUpdatesBtn" class="button button-primary">
                Проверить обновления
            </button>
        </div>

        <div id="updateStatusArea" class="update-status hidden">
            <!-- Dynamic Content -->
        </div>
        
        <div id="updateLog" class="terminal-log hidden">
            <!-- Logs -->
        </div>
    </div>
</div>

<script nonce="{{ csp_nonce() }}">
function setUpdateAlert(statusArea, type, lines, withUpdateButton = false) {
    statusArea.replaceChildren();
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;

    for (const line of lines) {
        const element = document.createElement(line.tag || 'p');
        element.textContent = line.text || '';
        alert.appendChild(element);
    }

    if (withUpdateButton) {
        const button = document.createElement('button');
        button.id = 'performUpdateBtn';
        button.className = 'button button-success';
        button.type = 'button';
        button.textContent = 'Обновить сейчас';
        alert.appendChild(button);
    }

    statusArea.appendChild(alert);
}

document.getElementById('checkUpdatesBtn').addEventListener('click', async () => {
    const btn = document.getElementById('checkUpdatesBtn');
    const statusArea = document.getElementById('updateStatusArea');
    const logArea = document.getElementById('updateLog');
    
    btn.disabled = true;
    btn.textContent = 'Проверка...';
    statusArea.classList.add('hidden');
    
    try {
        const response = await fetch("{{ url_for('check_updates_route') }}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            }
        });
        const json = await response.json();
        
        statusArea.classList.remove('hidden');
        
        if (json.status === 'success') {
            const data = json.data;
            if (data.update_available) {
                setUpdateAlert(statusArea, 'info', [
                    { tag: 'h4', text: `Доступно обновление: ${data.latest_version || ''}` },
                    { tag: 'p', text: data.release_notes || 'Нет описания релиза.' },
                ], true);
                
                document.getElementById('performUpdateBtn').addEventListener('click', performUpdate);
            } else {
                setUpdateAlert(statusArea, 'success', [
                    { tag: 'p', text: 'У вас установлена последняя версия.' },
                ]);
            }
        } else {
            setUpdateAlert(statusArea, 'danger', [
                { tag: 'p', text: `Ошибка: ${json.message || 'неизвестная ошибка'}` },
            ]);
        }
    } catch (e) {
        setUpdateAlert(statusArea, 'danger', [
            { tag: 'p', text: `Ошибка сети: ${e}` },
        ]);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Проверить снова';
    }
});

async function performUpdate() {
    if (!confirm('Вы уверены? Это действие перезапустит бота.')) return;
    
    const statusArea = document.getElementById('updateStatusArea');
    setUpdateAlert(statusArea, 'warning', [
        { tag: 'p', text: 'Выполняется обновление... Пожалуйста, подождите. Страница может перезагрузиться.' },
    ]);
    
    try {
        const response = await fetch("{{ url_for('perform_update_route') }}", {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token() }}' }
        });
        const json = await response.json();
        
        if (json.status === 'success') {
            setUpdateAlert(statusArea, 'success', [
                { tag: 'p', text: 'Обновление успешно! Бот перезагружается...' },
            ]);
            setTimeout(() => window.location.reload(), 10000);
        } else {
            setUpdateAlert(statusArea, 'danger', [
                { tag: 'p', text: `Ошибка обновления: ${json.message || 'неизвестная ошибка'}` },
            ]);
        }
    } catch (e) {
         setUpdateAlert(statusArea, 'warning', [
             { tag: 'p', text: 'Команда отправлена. Возможно, сервер уже перезагружается. Попробуйте обновить страницу через минуту.' },
         ]);
    }
}
</script>
{% endblock %}
